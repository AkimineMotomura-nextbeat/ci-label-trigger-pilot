name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dummy tests
        run: |
          echo "running dummy tests on $(git rev-parse HEAD)"
          sleep 20
          echo "simulating failure"
          exit 1

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: dummy lint
        run: echo "lint ok"

  ci-gate:
    if: always()
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: verify all jobs succeeded
        id: verdict
        run: |
          state=success
          for r in ${{ join(needs.*.result, ' ') }}; do
            [ "$r" = "success" ] || state=failure
          done
          echo "needs results: ${{ join(needs.*.result, ' ') }} -> $state"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: report commit status (plan B)
        if: always()
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}"
          -f state="${{ steps.verdict.outputs.state }}"
          -f context="ci/gate"
          -f description="label-triggered CI gate"
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: gate
        run: '[ "${{ steps.verdict.outputs.state }}" = "success" ]'
